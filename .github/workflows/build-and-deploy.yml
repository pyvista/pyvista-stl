name: Build and upload

on:
  pull_request:
  push:
    tags:
    - v*
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA. The trailing
# comment names the matching release tag for human readers. Dependabot
# keeps these in sync (see .github/dependabot.yml). Pinning to a tag,
# or to a moving branch like ``release/v1``, lets a compromised
# maintainer ship a malicious release that exfiltrates the PyPI OIDC
# token.

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0  # required for setuptools_scm

    - name: Build wheels
      uses: pypa/cibuildwheel@63fd63b352a9a8bdcc24791c9dbee952ee9a8abc  # v3.3.0

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: pyvista-stl-wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0  # required for setuptools_scm

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.13'

    - name: Build sdist
      run: |
        sudo apt-get update
        sudo apt-get install ninja-build -y
        pipx run build --sdist

    - name: Validate wheel metadata
      run: |
        pip install twine
        twine check dist/*

    - name: Validate sdist
      run: |
        pip install dist/*
        pip install pytest pyvista
        pytest

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: pyvista-stl-sdist
        path: dist/*.tar.gz

  upload_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pyvista-stl
    permissions:
      id-token: write  # mandatory for PyPI trusted publishing (OIDC)
      contents: write  # required to create a GitHub Release
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        path: dist
        merge-multiple: true
        pattern: pyvista-stl-*
    - run: ls -alR dist/
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --title "$TAG" \
          --generate-notes \
          ./dist/*.whl ./dist/*.tar.gz
