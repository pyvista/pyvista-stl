name: Build and upload

on:
  pull_request:
  push:
    tags:
    - v*
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA. The trailing
# comment names the matching release tag for human readers. Dependabot
# keeps these in sync (see .github/dependabot.yml). Pinning to a tag,
# or to a moving branch like ``release/v1``, lets a compromised
# maintainer ship a malicious release that exfiltrates the PyPI OIDC
# token.

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 0  # required for setuptools_scm

    - name: Build wheels
      uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c  # v4.1.1

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: pyvista-stl-wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 0  # required for setuptools_scm

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.13'

    - name: Build sdist
      run: |
        sudo apt-get update
        sudo apt-get install ninja-build -y
        pipx run build --sdist

    - name: Validate wheel metadata
      run: |
        pip install twine
        twine check dist/*

    - name: Validate sdist
      run: |
        pip install dist/*
        pip install pytest pyvista
        pytest

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: pyvista-stl-sdist
        path: dist/*.tar.gz

  upload_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pyvista-stl
    permissions:
      id-token: write  # mandatory for PyPI trusted publishing (OIDC)
      contents: write  # required to create a GitHub Release
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        path: dist
        merge-multiple: true
        pattern: pyvista-stl-*
    - run: ls -alR dist/
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --title "$TAG" \
          --generate-notes \
          ./dist/*.whl ./dist/*.tar.gz
