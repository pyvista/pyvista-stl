# See https://pre-commit.ci/
ci:
  autofix_prs: true
  autoupdate_schedule: quarterly

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.20
  hooks:
  - id: ruff-check
    args: [--fix, --exit-non-zero-on-fix]
    exclude: ^(docs/|tests)
  - id: ruff-format

- repo: https://github.com/keewis/blackdoc
  rev: v0.4.6
  hooks:
  - id: blackdoc
    exclude: README.rst

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.2
  hooks:
  - id: codespell
    args: [--skip=*.vt*]

- repo: https://github.com/pycqa/pydocstyle
  rev: 6.3.0
  hooks:
  - id: pydocstyle
    additional_dependencies: [tomli==2.0.1]
    files: ^src/pyvista_stl/.*\.py

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: trailing-whitespace
  - id: check-added-large-files
    # Cap individual committed files at 500 KB. The committed test
    # corpus tops out around 250 KB; anything larger is almost
    # certainly an accident (a real-world STL, a profiling trace,
    # a build artifact). Use ``git lfs`` or download-on-demand when
    # a genuine large file is needed.
    args: [--maxkb=500]

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.1.0
  hooks:
  - id: mypy
    additional_dependencies: [numpy>=2.0, npt-promote==0.1]


- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix]
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v22.1.5
  hooks:
  - id: clang-format

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.37.4
  hooks:
  - id: check-github-workflows

- repo: https://github.com/dzhu/rstfmt
  rev: v0.0.14
  hooks:
  - id: rstfmt
