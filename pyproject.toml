[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.10", "nanobind>=1.3.2", "setuptools-scm>=8"]

[project]
authors = [
  {name = "PyVista Developers", email = "info@pyvista.org"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization"
]
dependencies = ["numpy"]
description = "Read in STL files"
dynamic = ["version"]
keywords = ["stl", "pyvista", "mesh", "reader", "3d"]
license = "MIT"
name = "pyvista-stl"
readme = "README.rst"
requires-python = ">=3.10"

# Requires pyvista >= 0.48
[project.entry-points."pyvista.readers"]
".stl" = "pyvista_stl:read_as_mesh"

[project.optional-dependencies]
pyvista = ["pyvista>=0.48"]

[project.urls]
Homepage = "https://github.com/pyvista/pyvista-stl"
Issues = "https://github.com/pyvista/pyvista-stl/issues"
Repository = "https://github.com/pyvista/pyvista-stl"

[tool.cibuildwheel]
archs = ["auto64"]  # 64-bit only
build = "cp310-* cp311-* cp312-* cp313-* cp314*"
skip = " cp314t-* *musllinux*"  # disable musl-based wheels and free threading
test-command = "pytest {project}/tests"
test-requires = "pytest pyvista"

[tool.cibuildwheel.macos]
archs = ["native"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"  # Needed for full C++17 support on MacOS

[tool.codespell]
quiet-level = 3
skip = '*.cxx,*.h,*.gif,*.png,*.jpg,*.js,*.html,*.doctree,*.ttf,*.woff,*.woff2,*.eot,*.mp4,*.inv,*.pickle,*.ipynb,flycheck*,./.git/*,./.hypothesis/*,*.yml,./doc/build/*,./doc/images/*,./dist/*,*~,.hypothesis*,*.cpp,*.c'

[tool.mypy]
# pytest's mark.* decorators are not typed in their installed stubs, so
# strict-mode mypy flags every decorated test as "untyped". Tests are
# runtime-validated; we don't gain anything from refusing to type-check
# them just because a decorator from pytest lacks a stub.
disallow_untyped_decorators = false
plugins = ['npt_promote']
strict = true

[tool.pytest.ini_options]
filterwarnings = [
  # bogus numpy ABI warning (see numpy/#432)
  "ignore:.*numpy.dtype size changed.*:RuntimeWarning",
  "ignore:.*numpy.ufunc size changed.*:RuntimeWarning"
]
junit_family = "legacy"
testpaths = 'tests'

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
minimum-version = "0.10"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.exclude = [".github", "*.png", "tests", ".mypy_cache", ".pre-commit-config.yaml", "*_cache", "CONTRIBUTING.md", ".gitignore"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
